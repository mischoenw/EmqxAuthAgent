# EMQX 5.x Authorization configuration
#
# Include this file in emqx.conf via:
#   include "authorization.conf"
#
# This configures EMQX to call EmqxAuthAgent for every publish/subscribe
# authorization decision. The client's mTLS certificate DN is forwarded in
# the request body so the agent can evaluate O/OU-based rules.

authorization {
  # Default action when no source returns a result.
  no_match = deny

  # Action to take when a request is denied.
  deny_action = disconnect

  # Cache authorization results to reduce round-trips for frequent publishers.
  cache {
    enable   = true
    max_size = 32    # max cached entries per client
    ttl      = 1m    # positive results cached for 1 minute
  }

  sources = [
    {
      type   = http
      enable = true

      # Point to the EmqxAuthAgent service.
      # In Docker Compose, use the service name as hostname.
      url = "http://emqx-auth-agent:8000/mqtt/authz"

      method = post
      headers {
        "Content-Type" = "application/json"
        "Accept"       = "application/json"
      }

      # Body template — EMQX substitutes ${variable} placeholders at runtime.
      # cert_dn contains the full client certificate DN (e.g.
      #   "CN=device1,OU=floor-sensors,O=AcmeCorp").
      # cert_cn contains only the CN field as a shortcut.
      body {
        username         = "${username}"
        clientid         = "${clientid}"
        peerhost         = "${peerhost}"
        topic            = "${topic}"
        action           = "${action}"
        cert_dn          = "${cert_subject}"
        cert_cn          = "${cert_common_name}"
      }

      request_timeout  = 5s
      connect_timeout  = 5s
      max_retries      = 2
      retry_interval   = 100ms

      # Connection pool for high-throughput deployments.
      pool_size = 8
    }
  ]
}

