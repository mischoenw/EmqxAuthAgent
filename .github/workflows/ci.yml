name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────
  # Runs the unit tests directly on the GitHub Actions runner using Conan +
  # CMake. The Conan package cache (~/.conan2/p) is persisted between runs
  # so libwebsockets and yaml-cpp are only compiled once.
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3-pip
          pip3 install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          # Cache is per-OS and per conanfile content.
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Conan install
        run: |
          conan profile detect --force
          conan install . \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=17

      - name: CMake configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=Release/generators/conan_toolchain.cmake

      - name: Build tests
        run: cmake --build build --target run_tests -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ── Job 2: Build Docker Image & Push to GHCR ────────────────────────────
  # Builds the multi-stage Dockerfile and pushes the result to the GitHub
  # Container Registry (ghcr.io). Docker layer cache is stored in GitHub
  # Actions cache (type=gha) so the expensive Conan compile layer is reused
  # across runs as long as conanfile.txt is unchanged.
  #
  # Published image: ghcr.io/<owner>/emqxauthagent
  # Tags:
  #   latest          → on push to main
  #   v1.2.3          → on tag v1.2.3
  #   v1.2            → on tag v1.2.3
  #   sha-<short-sha> → always
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test  # only build image when tests pass
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        # Only login when we're actually going to push (not on PRs from forks)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/emqxauthagent
          tags: |
            # latest on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # semver tags: v1.2.3 → 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short SHA for traceability
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          # Push only on non-PR events (main pushes and tags)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend: Docker layers are cached between
          # workflow runs. mode=max caches all intermediate layers (including
          # the slow Conan compile layer), not just the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max
