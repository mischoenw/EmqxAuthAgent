# EMQX mTLS Authorization Rules
#
# Zertifikatsformat:
#   O  = 8-stellige Organisations-ID,  z.B. aabbccdd
#   OU = 4+4-stellige Einheits-ID,     z.B. 0001-0001
#
# Topicstruktur:
#   /{o}/{ou}/#   →  z.B. /aabbccdd/0001-0001/sensor/temp
#
# Platzhalter in Topicpatterns:
#   {o}   wird durch den ersten O-Wert des Zertifikats ersetzt
#   {ou}  wird durch den ersten OU-Wert des Zertifikats ersetzt
#   {cn}  wird durch den CN-Wert des Zertifikats ersetzt
#   +     MQTT single-level wildcard
#   #     MQTT multi-level wildcard (muss letztes Segment sein)
#
# Regelauswertung:
#   Regeln werden nach Spezifität sortiert (O+OU > O-only > wildcard).
#   Erste passende Regel gewinnt; kein Treffer im Topicpattern → nächste Regel.
#   Kein Treffer insgesamt → deny.

rules:
  # Jedes Gerät darf ausschließlich sein eigenes O/OU-Namespace verwenden.
  # Ein Gerät mit O=aabbccdd und OU=0001-0001 hat Zugriff nur auf:
  #   /aabbccdd/0001-0001/#
  - id: device-own-namespace
    allow:
      publish:
        - "/{o}/{ou}/#"
      subscribe:
        - "/{o}/{ou}/#"
